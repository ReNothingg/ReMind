  <style>
    .remind-pet-shy {
      animation-duration: 2150ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-shy-0 { animation-name: remind-pet-shy-0; }
    @keyframes remind-pet-shy-0 {
      0%, 100% { visibility: visible; }
      21.39535% { visibility: hidden; }
    }
    .remind-pet-shy-1 { animation-name: remind-pet-shy-1; }
    @keyframes remind-pet-shy-1 {
      21.39535% { visibility: visible; }
      0%, 31.16279%, 100% { visibility: hidden; }
    }
    .remind-pet-shy-2 { animation-name: remind-pet-shy-2; }
    @keyframes remind-pet-shy-2 {
      31.16279% { visibility: visible; }
      0%, 56.74419%, 100% { visibility: hidden; }
    }
    .remind-pet-shy-3 { animation-name: remind-pet-shy-3; }
    @keyframes remind-pet-shy-3 {
      56.74419% { visibility: visible; }
      0%, 68.37209%, 100% { visibility: hidden; }
    }
    .remind-pet-shy-4 { animation-name: remind-pet-shy-4; }
    @keyframes remind-pet-shy-4 {
      68.37209% { visibility: visible; }
      0%, 90.23256%, 100% { visibility: hidden; }
    }
    .remind-pet-shy-5 { animation-name: remind-pet-shy-5; }
    @keyframes remind-pet-shy-5 {
      90.23256% { visibility: visible; }
      0%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-shy { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-shy { animation: none; }
    }
  </style>
