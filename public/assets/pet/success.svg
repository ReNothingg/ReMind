      36.66667% { visibility: visible; }
      0%, 41.11111%, 100% { visibility: hidden; }
    }
    .remind-pet-success-7 { animation-name: remind-pet-success-7; }
    @keyframes remind-pet-success-7 {
      41.11111% { visibility: visible; }
      0%, 48.33333%, 100% { visibility: hidden; }
    }
    .remind-pet-success-8 { animation-name: remind-pet-success-8; }
    @keyframes remind-pet-success-8 {
      48.33333% { visibility: visible; }
      0%, 73.33333%, 100% { visibility: hidden; }
    }
    .remind-pet-success-9 { animation-name: remind-pet-success-9; }
    @keyframes remind-pet-success-9 {
      73.33333%, 100% { visibility: visible; }
      0% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-success { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-success { animation: none; }
    }
  </style>
