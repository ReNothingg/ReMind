  <style>
    .remind-pet-success {
      animation-duration: 1800ms;
      animation-timing-function: step-end;
      animation-iteration-count: 1;
      animation-fill-mode: both;
    }
    .remind-pet-success-0 { animation-name: remind-pet-success-0; }
    @keyframes remind-pet-success-0 {
      0% { visibility: visible; }
      9.44444%, 100% { visibility: hidden; }
    }
    .remind-pet-success-1 { animation-name: remind-pet-success-1; }
    @keyframes remind-pet-success-1 {
      9.44444% { visibility: visible; }
      0%, 15.55556%, 100% { visibility: hidden; }
    }
    .remind-pet-success-2 { animation-name: remind-pet-success-2; }
    @keyframes remind-pet-success-2 {
      15.55556% { visibility: visible; }
      0%, 20%, 100% { visibility: hidden; }
    }
    .remind-pet-success-3 { animation-name: remind-pet-success-3; }
    @keyframes remind-pet-success-3 {
      20% { visibility: visible; }
      0%, 24.72222%, 100% { visibility: hidden; }
    }
    .remind-pet-success-4 { animation-name: remind-pet-success-4; }
    @keyframes remind-pet-success-4 {
      24.72222% { visibility: visible; }
      0%, 31.66667%, 100% { visibility: hidden; }
    }
    .remind-pet-success-5 { animation-name: remind-pet-success-5; }
