  <style>
    .remind-pet-attentive {
      animation-duration: 2140ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-attentive-0 { animation-name: remind-pet-attentive-0; }
