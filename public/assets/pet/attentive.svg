    @keyframes remind-pet-attentive-3 {
      83.64486% { visibility: visible; }
      0%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-attentive { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-attentive { animation: none; }
    }
