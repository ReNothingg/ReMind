  <style>
    .remind-pet-waiting {
      animation-duration: 2405ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-waiting-0 { animation-name: remind-pet-waiting-0; }
    @keyframes remind-pet-waiting-0 {
      0%, 42.20374%, 50.51975%, 86.27859%, 100% { visibility: visible; }
      38.25364%, 46.77755%, 61.33056% { visibility: hidden; }
    }
    .remind-pet-waiting-1 { animation-name: remind-pet-waiting-1; }
    @keyframes remind-pet-waiting-1 {
      38.25364%, 46.77755% { visibility: visible; }
      0%, 42.20374%, 50.51975%, 100% { visibility: hidden; }
    }
    .remind-pet-waiting-2 { animation-name: remind-pet-waiting-2; }
    @keyframes remind-pet-waiting-2 {
      61.33056% { visibility: visible; }
      0%, 82.12058%, 100% { visibility: hidden; }
    }
    .remind-pet-waiting-3 { animation-name: remind-pet-waiting-3; }
    @keyframes remind-pet-waiting-3 {
      82.12058% { visibility: visible; }
      0%, 86.27859%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-waiting { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-waiting { animation: none; }
    }
  </style>
