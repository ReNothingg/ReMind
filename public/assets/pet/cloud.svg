  <style>
    .remind-pet-cloud {
      animation-duration: 1950ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-cloud-0 { animation-name: remind-pet-cloud-0; }
    @keyframes remind-pet-cloud-0 {
      0%, 100% { visibility: visible; }
      23.07692% { visibility: hidden; }
    }
    .remind-pet-cloud-1 { animation-name: remind-pet-cloud-1; }
    @keyframes remind-pet-cloud-1 {
      23.07692% { visibility: visible; }
      0%, 30.25641%, 100% { visibility: hidden; }
    }
    .remind-pet-cloud-2 { animation-name: remind-pet-cloud-2; }
    @keyframes remind-pet-cloud-2 {
      30.25641% { visibility: visible; }
      0%, 37.4359%, 100% { visibility: hidden; }
    }
    .remind-pet-cloud-3 { animation-name: remind-pet-cloud-3; }
    @keyframes remind-pet-cloud-3 {
      37.4359% { visibility: visible; }
      0%, 46.66667%, 100% { visibility: hidden; }
    }
    .remind-pet-cloud-4 { animation-name: remind-pet-cloud-4; }
    @keyframes remind-pet-cloud-4 {
      46.66667% { visibility: visible; }
      0%, 60.51282%, 100% { visibility: hidden; }
    }
    .remind-pet-cloud-5 { animation-name: remind-pet-cloud-5; }
    @keyframes remind-pet-cloud-5 {
      60.51282% { visibility: visible; }
      0%, 69.74359%, 100% { visibility: hidden; }
    }
    .remind-pet-cloud-6 { animation-name: remind-pet-cloud-6; }
    @keyframes remind-pet-cloud-6 {
      69.74359% { visibility: visible; }
      0%, 80%, 100% { visibility: hidden; }
    }
    .remind-pet-cloud-7 { animation-name: remind-pet-cloud-7; }
    @keyframes remind-pet-cloud-7 {
      80% { visibility: visible; }
      0%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-cloud { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-cloud { animation: none; }
    }
  </style>
