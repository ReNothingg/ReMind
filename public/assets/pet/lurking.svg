      89.28571% { visibility: visible; }
      0%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-lurking { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-lurking { animation: none; }
    }
