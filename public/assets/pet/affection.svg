      animation-fill-mode: both;
    }
    .remind-pet-affection-0 { animation-name: remind-pet-affection-0; }
    @keyframes remind-pet-affection-0 {
      0%, 79.69543%, 100% { visibility: visible; }
      18.27411% { visibility: hidden; }
    }
