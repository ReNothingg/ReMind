  <style>
    .remind-pet-racing {
      animation-duration: 1895ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-racing-0 { animation-name: remind-pet-racing-0; }
    @keyframes remind-pet-racing-0 {
      0%, 76.2533%, 100% { visibility: visible; }
      28.49604% { visibility: hidden; }
    }
    .remind-pet-racing-1 { animation-name: remind-pet-racing-1; }
    @keyframes remind-pet-racing-1 {
      28.49604% { visibility: visible; }
      0%, 34.56464%, 100% { visibility: hidden; }
    }
    .remind-pet-racing-2 { animation-name: remind-pet-racing-2; }
    @keyframes remind-pet-racing-2 {
      34.56464% { visibility: visible; }
      0%, 40.63325%, 100% { visibility: hidden; }
    }
    .remind-pet-racing-3 { animation-name: remind-pet-racing-3; }
    @keyframes remind-pet-racing-3 {
      40.63325% { visibility: visible; }
      0%, 46.70185%, 100% { visibility: hidden; }
    }
    .remind-pet-racing-4 { animation-name: remind-pet-racing-4; }
    @keyframes remind-pet-racing-4 {
      46.70185% { visibility: visible; }
      0%, 52.5066%, 100% { visibility: hidden; }
    }
    .remind-pet-racing-5 { animation-name: remind-pet-racing-5; }
    @keyframes remind-pet-racing-5 {
      52.5066% { visibility: visible; }
      0%, 58.31135%, 100% { visibility: hidden; }
    }
    .remind-pet-racing-6 { animation-name: remind-pet-racing-6; }
    @keyframes remind-pet-racing-6 {
      58.31135% { visibility: visible; }
      0%, 64.11609%, 100% { visibility: hidden; }
    }
    .remind-pet-racing-7 { animation-name: remind-pet-racing-7; }
    @keyframes remind-pet-racing-7 {
      64.11609% { visibility: visible; }
      0%, 69.92084%, 100% { visibility: hidden; }
    }
    .remind-pet-racing-8 { animation-name: remind-pet-racing-8; }
    @keyframes remind-pet-racing-8 {
      69.92084% { visibility: visible; }
      0%, 76.2533%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-racing { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-racing { animation: none; }
    }
  </style>
