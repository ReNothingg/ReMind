<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" shape-rendering="crispEdges">
  <style>
    .remind-pet-paused {
      animation-duration: 1800ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-paused-0 { animation-name: remind-pet-paused-0; }
    @keyframes remind-pet-paused-0 {
      0%, 63.88889%, 100% { visibility: visible; }
      54.44444% { visibility: hidden; }
    }
    .remind-pet-paused-1 { animation-name: remind-pet-paused-1; }
    @keyframes remind-pet-paused-1 {
      54.44444% { visibility: visible; }
      0%, 63.88889%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-paused { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-paused { animation: none; }
    }
  </style>
