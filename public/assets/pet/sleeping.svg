  <style>
    .remind-pet-sleeping {
      animation-duration: 2940ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-sleeping-0 { animation-name: remind-pet-sleeping-0; }
    @keyframes remind-pet-sleeping-0 {
      0%, 100% { visibility: visible; }
      38.09524% { visibility: hidden; }
    }
    .remind-pet-sleeping-1 { animation-name: remind-pet-sleeping-1; }
    @keyframes remind-pet-sleeping-1 {
      38.09524%, 81.63265% { visibility: visible; }
      0%, 54.08163%, 100% { visibility: hidden; }
    }
    .remind-pet-sleeping-2 { animation-name: remind-pet-sleeping-2; }
    @keyframes remind-pet-sleeping-2 {
      54.08163% { visibility: visible; }
      0%, 81.63265%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-sleeping { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-sleeping { animation: none; }
    }
  </style>
