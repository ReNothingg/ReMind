  <style>
    .remind-pet-coding {
      animation-duration: 1120ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-coding-0 { animation-name: remind-pet-coding-0; }
    @keyframes remind-pet-coding-0 {
      0%, 76.78571%, 100% { visibility: visible; }
      25% { visibility: hidden; }
    }
    .remind-pet-coding-1 { animation-name: remind-pet-coding-1; }
    @keyframes remind-pet-coding-1 {
      25%, 43.30357% { visibility: visible; }
      0%, 34.82143%, 52.23214%, 100% { visibility: hidden; }
    }
    .remind-pet-coding-2 { animation-name: remind-pet-coding-2; }
    @keyframes remind-pet-coding-2 {
      34.82143% { visibility: visible; }
      0%, 43.30357%, 100% { visibility: hidden; }
    }
    .remind-pet-coding-3 { animation-name: remind-pet-coding-3; }
    @keyframes remind-pet-coding-3 {
      52.23214% { visibility: visible; }
      0%, 62.5%, 100% { visibility: hidden; }
    }
    .remind-pet-coding-4 { animation-name: remind-pet-coding-4; }
    @keyframes remind-pet-coding-4 {
      62.5% { visibility: visible; }
      0%, 76.78571%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-coding { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-coding { animation: none; }
    }
  </style>
