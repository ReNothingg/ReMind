  <style>
    .remind-pet-sad {
      animation-duration: 2200ms;
      animation-timing-function: step-end;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .remind-pet-sad-0 { animation-name: remind-pet-sad-0; }
    @keyframes remind-pet-sad-0 {
      0%, 79.09091%, 100% { visibility: visible; }
      24.54545% { visibility: hidden; }
    }
    .remind-pet-sad-1 { animation-name: remind-pet-sad-1; }
    @keyframes remind-pet-sad-1 {
      24.54545%, 64.54545% { visibility: visible; }
      0%, 37.72727%, 79.09091%, 100% { visibility: hidden; }
    }
    .remind-pet-sad-2 { animation-name: remind-pet-sad-2; }
    @keyframes remind-pet-sad-2 {
      37.72727% { visibility: visible; }
      0%, 45.90909%, 100% { visibility: hidden; }
    }
    .remind-pet-sad-3 { animation-name: remind-pet-sad-3; }
    @keyframes remind-pet-sad-3 {
      45.90909% { visibility: visible; }
      0%, 64.54545%, 100% { visibility: hidden; }
    }
    #still:target ~ .remind-pet-sad { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .remind-pet-sad { animation: none; }
    }
  </style>
