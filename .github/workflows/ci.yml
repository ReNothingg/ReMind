name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for obvious secrets
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          patterns = [
              r"AIza[0-9A-Za-z_-]{20,}",
              r"GOCSPX-[A-Za-z0-9_-]{10,}",
              r"-----BEGIN (?:RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY-----",
          ]
          combined = re.compile("|".join(patterns))

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings = []
          for rel in files:
              path = Path(rel)
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for lineno, line in enumerate(text.splitlines(), start=1):
                  if combined.search(line):
                      findings.append(f"{rel}:{lineno}: potential secret pattern")

          if findings:
              print("Potential hardcoded secrets found:")
              for item in findings:
                  print(item)
              sys.exit(1)
          print("No obvious secret patterns found in tracked files.")
          PY

  backend-checks:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -c requirements/constraints.txt

      - name: Ruff
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Mypy
        run: mypy app_factory.py routes utils services

  frontend-build:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check frontend (base + strict scope)
        run: npm run typecheck

      - name: OpenAPI generated client is up to date
        run: npm run openapi:check

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  security-pipeline:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -c requirements/constraints.txt pip-audit bandit
          npm ci

      - name: Run pip-audit report
        run: |
          status=0
          pip-audit -r requirements.txt --format json --output pip-audit.json || status=$?
          if [ "$status" -gt 1 ]; then
            echo "pip-audit failed operationally with exit code $status"
            exit "$status"
          fi
          test -s pip-audit.json

      - name: Run npm audit report
        run: |
          status=0
          npm audit --json --audit-level=high > npm-audit.json || status=$?
          if [ "$status" -gt 1 ]; then
            echo "npm audit failed operationally with exit code $status"
            exit "$status"
          fi
          test -s npm-audit.json

      - name: Run Bandit report
        run: |
          status=0
          bandit -r . -f json -o bandit.json -q || status=$?
          if [ "$status" -gt 1 ]; then
            echo "Bandit failed operationally with exit code $status"
            exit "$status"
          fi
          test -s bandit.json

      - name: Run Semgrep report
        run: |
          status=0
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            semgrep/semgrep:1.170.0 \
            semgrep scan --error --config p/security-audit --config p/secrets \
              --exclude node_modules --exclude dist --json . > semgrep.json || status=$?
          if [ "$status" -gt 1 ]; then
            echo "Semgrep failed operationally with exit code $status"
            exit "$status"
          fi
          test -s semgrep.json

      - name: Enforce high-severity security gate
        run: python scripts/security_gate.py --pip pip-audit.json --npm npm-audit.json --bandit bandit.json --semgrep semgrep.json
